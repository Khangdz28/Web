<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Unlock Script</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      text-align: center;
      padding: 30px;
    }
    .card {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      position: relative;
    }
    h2 { color: #38bdf8; }
    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-follow { background: #3b82f6; color: white; }
    .btn-like { background: #ec4899; color: white; }
    .btn-watch { background: #f59e0b; color: white; }
    .btn-ytlike { background: #ef4444; color: white; } /* Like video YouTube */
    .btn-unlock { background: #22c55e; color: white; display: none; }
    .done {
      background: #22c55e !important;
      color: white;
    }
    .progress-container {
      background: #334155;
      border-radius: 10px;
      margin-top: 20px;
      height: 20px;
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 10px;
      transition: width 0.5s ease-in-out;
    }
    #progressText {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 14px;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Unlock Script</h2>
    <p>Hoàn thành nhiệm vụ để mở khóa script</p>

    <button class="btn-follow" onclick="openTask(1, this)">📌 Follow TikTok</button>
    <button class="btn-like" onclick="openTask(2, this)">Follow Acc Phụ</button>
    <button class="btn-watch" onclick="openTask(3, this)">Like video</button>
    <button class="btn-watch" onclick="openTask(4, this)">Đăng Kí Youtube</button>
    <button class="btn-ytlike" onclick="openTask(5, this)">Like video</button>

    <button class="btn-unlock" id="unlockBtn" onclick="unlockScript()">✅ Unlock Script</button>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
      <span id="progressText">0%</span>
    </div>
  </div>

  <script>
    let tasksCompleted = 0;
    const totalTasks = 5;

    function openTask(taskId, btn) {
      let url = "";
      if (taskId === 1) {
        url = "https://www.tiktok.com/@khngscript?_t=ZS-90G7cXf2Px4&_r=1";
      } else if (taskId === 2) {
        url = "https://www.tiktok.com/@mozillontop?_t=ZS-90LrcV6OhAm&_r=1";
      } else if (taskId === 3) {
        url = "https://www.tiktok.com/@khngscript/video/7565131359728012562?_r=1&u_code=e38gl40ldaek53&region=VN&mid=7531687232491621121&preview_pb=0&sharer_language=en&_d=emc693f296mk47&share_item_id=7565131359728012562&source=h5_t&timestamp=1769316317&user_id=7130576383294571546&sec_user_id=MS4wLjABAAAAWTLqAUpy64HEArJWo5DCmMH6xsIQ26Gv-aiyRyvyoI0vTgUg0cMFd2NR9J2gsqUK&item_author_type=2&social_share_type=0&utm_source=copy&utm_campaign=client_share&utm_medium=android&share_iid=7598879257646106375&share_link_id=3e07ec3c-4e42-42e1-b06c-149b1c749bcd&share_app_id=1180&ugbiz_name=MAIN&ug_btm=b2878%2Cb2878&link_reflow_popup_iteration_sharer=%7B%22click_empty_to_play%22%3A1%2C%22dynamic_cover%22%3A1%2C%22follow_to_play_duration%22%3A-1.0%2C%22profile_clickable%22%3A1%7D&enable_checksum=1";
      } else if (taskId === 4) {
        url = "https://youtube.com/@khngscript?si=XKMUBIGQPf7hXdYT";
      } else if (taskId === 5) {
        url = "https://youtu.be/h8UVSI7QwGI?si=3w4anDaZx0jt0zBo";
      }

      // Mở liên kết trong tab mới, an toàn hơn
      window.open(url, "_blank", "noopener,noreferrer");

      btn.disabled = true;
      btn.textContent = "⏳ Đang xử lý...";

      setTimeout(() => {
        completeTask(taskId, btn);
      }, 3000);
    }

    function completeTask(taskId, btn) {
      if (!btn.classList.contains("done")) {
        btn.classList.add("done");
        btn.textContent = "✔ Hoàn thành";
        tasksCompleted++;
        updateProgress();
      }
    }

    function updateProgress() {
      const bar = document.getElementById("progressBar");
      const text = document.getElementById("progressText");
      let percent = Math.round((tasksCompleted / totalTasks) * 100);

      bar.style.width = percent + "%";
      text.textContent = percent + "%";

      if (tasksCompleted === totalTasks) {
        document.getElementById("unlockBtn").style.display = "block";
      }
    }

    function unlockScript() {
      window.location.href = "choose.html";
    }
  </script>
</body>
</html>
